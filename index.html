<!DOCTYPE html>
<html lang="en">
  
<!--  styles 3 and 4  -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tense Matching Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="switch.css">
</head>
<body>
    <div class="container">
        <h1>Tense Matching Game</h1>
        <p>Drag the correct tense name onto the matching sentence.</p>

        <!-- Toggle Switches -->
        <div class="settings">
            <label class="switch">
                <input type="checkbox" id="toggle-timer" checked>
                <span class="slider round"></span>
                <p>Enable Timer</p>
            </label>

            <label class="switch">
                <input type="checkbox" id="toggle-multiplayer" checked>
                <span class="slider round"></span>
                <p>Enable Multiplayer</p>
            </label>

            <label class="switch">
                <input type="checkbox" id="toggle-grammar">
                <span class="slider round"></span>
                <p>Show Grammar Groups</p>
            </label>
        </div>

        <p id="timer">Time Left: <span id="time">60</span> seconds</p>
        <p id="turn"></p>

        <div class="game-container">
            <div id="sentences-container"></div>
            <div id="tenses-container"></div>
        </div>

        <button onclick="checkAnswers();">Check Answers</button>
        <p id="score"></p>
        <p id="correct-answers"></p>
    </div>

    <script type="module" src="script.js"></script>
</body>
  <script type="module">
    import { checkAnswers } from './script.js';
    window.checkAnswers = checkAnswers; // Attach it globally so the button can call it
</script>
</html>
